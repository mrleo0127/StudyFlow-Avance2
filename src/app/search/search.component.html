
<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>

  <GridLayout columns="50, *">
    <Label
      class="fas"
      text="&#xf0c9;"
      (tap)="onDrawerButtonTap()"
    ></Label>

    <Label
      class="action-bar-title"
      text="Buscar recursos"
      col="1"
    ></Label>
  </GridLayout>
</ActionBar>

<GridLayout rows="auto, *" class="page-content">

  <!-- Buscador -->
  <StackLayout row="0" class="search-container">

    <TextField
      hint="Buscar por título o categoría..."
      [(ngModel)]="searchText"
      class="search-input"
    ></TextField>

    <Button
      text="Buscar"
      (tap)="onSearch()"
      class="btn btn-primary"
    ></Button>

  </StackLayout>

  <!-- Resultados -->
  <GridLayout row="1" rows="auto, *">

    <Label
      row="0"
      *ngIf="loading"
      text="Cargando recursos..."
      class="empty-message"
    ></Label>

    <Label
      row="0"
      *ngIf="errorMessage"
      [text]="errorMessage"
      class="empty-message"
    ></Label>

    <ListView
      row="1"
      [items]="resources"
      separatorColor="transparent"
      class="tasks-list"
      *ngIf="!loading && !errorMessage && resources.length > 0"
    >
      <ng-template let-resource="item">

        <StackLayout class="task-list-item">
          <GridLayout columns="*, auto" class="task-card">

            <StackLayout col="0">

              <Label
                [text]="resource.title"
                class="task-title"
                textWrap="true"
              ></Label>

              <Label
                [text]="'Categoría: ' + resource.category"
                class="task-details"
                textWrap="true"
              ></Label>

              <Label
                [text]="resource.description"
                class="task-details"
                textWrap="true"
              ></Label>

            </StackLayout>

            <Label
              col="1"
              [text]="favoriteIds.includes(resource.id) ? '★' : '☆'"
              [color]="favoriteIds.includes(resource.id) ? '#F5B400' : '#808080'"
              fontSize="28"
              verticalAlignment="top"
              padding="10"
              (tap)="toggleFavorite(resource)"
            ></Label>

          </GridLayout>
        </StackLayout>

      </ng-template>
    </ListView>

    <Label
      row="1"
      *ngIf="!loading && !errorMessage && resources.length === 0"
      text="No se encontraron recursos."
      class="empty-message"
    ></Label>

  </GridLayout>
</GridLayout>
